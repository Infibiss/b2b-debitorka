# Temporary $0 deployment. Free Postgres expires 30 days after creation.
# Real RU customer data requires the deployment/data-processing review in docs/operations.md.
databases:
  - name: agentpay-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: agentpay
    user: agentpay
    ipAllowList: []
services:
  - type: web
    name: agentpay-b2b
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    numInstances: 1
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_TIMEZONE
        value: Europe/Moscow
      - key: SECURE_COOKIES
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: agentpay-db
          property: connectionString
      - key: PORT
        value: "10000"
