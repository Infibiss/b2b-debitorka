name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agentpay-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agentpay_test
          POSTGRES_PASSWORD: agentpay-test-only
          POSTGRES_DB: agentpay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentpay_test -d agentpay_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, verified official tag
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Audit runtime Python dependencies
        run: python -m pip_audit -r requirements.txt --progress-spinner off
      - name: Use PostgreSQL service client tools
        shell: bash
        run: |
          set -euo pipefail
          # Keep dump/restore clients on the same version as the test server.
          client_dir="$RUNNER_TEMP/postgres-client"
          mkdir -p "$client_dir"
          for tool in pg_dump pg_restore; do
            cat > "$client_dir/$tool" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker exec -i \
            -e PGHOST -e PGPORT -e PGDATABASE -e PGUSER -e PGPASSWORD \
            -e PGSSLMODE -e PGSSLROOTCERT -e PGCONNECT_TIMEOUT -e PGOPTIONS \
            '${{ job.services.postgres.id }}' "$(basename "$0")" "$@"
          SH
            chmod 700 "$client_dir/$tool"
          done
          echo "$client_dir" >> "$GITHUB_PATH"
          "$client_dir/pg_dump" --version
          "$client_dir/pg_restore" --version
      - name: Test API and operations
        env:
          TEST_POSTGRES_URL: postgresql://agentpay_test:agentpay-test-only@127.0.0.1:5432/agentpay_test
        run: python -m pytest -q
      - name: Evaluate agent safety regressions
        run: python -m server.agent_evals --mode replay --out var/agent-eval-replay.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
      - name: Check TypeScript
        run: npm run check
      - name: Build production frontend
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test browser workflows
        run: npm run test:e2e
      - name: Build production container
        run: docker build --tag agentpay:ci .
      - name: Save browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-diagnostics
          path: |
            e2e/report/
            e2e/results/
          if-no-files-found: ignore
          retention-days: 7
